<!-- Theme, resolved before the stylesheet paints — without this the page renders
     light for a frame and then snaps dark. 'auto' (the default) asks the OS.
     Resolving it here rather than in CSS means the stylesheet needs only one
     dark rule instead of a @media copy and a data-theme copy of every colour.
     MKR.ui.theme() writes the same key from Settings and re-runs this. -->
<script>window.__mkrTheme=function(){try{var t=localStorage.getItem('mkr_theme')||'auto';
if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}};__mkrTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
if((localStorage.getItem('mkr_theme')||'auto')==='auto')__mkrTheme();});}catch(e){}</script>
